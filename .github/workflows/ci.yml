name: Ci
on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

jobs:
  ci:
    name: Ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub ci
      issues: write # to be able to comment on cid issues
      pull-requests: write # to be able to comment on cid pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
